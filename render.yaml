# render.yaml

services:
  - type: web
    name: votingsphere-api
    env: python
    plan: free
    autoDeploy: true
    buildCommand: |
      pip install -r requirements.txt
      python manage.py collectstatic --noinput
    preDeployCommand: |
      python manage.py migrate --noinput
    startCommand: daphne -b 0.0.0.0 -p $PORT VotingSphere.asgi:application
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: VotingSphere.settings.prod
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: votingsphere-pg
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: votingsphere-redis
          property: connectionString
      # During first deploy, you can leave this as *; then tighten to the exact Render host
      - key: ALLOWED_HOSTS
        value: "*"
      # Allow your local web dev and (later) your staging web origin
      - key: CORS_ALLOWED_ORIGINS
        value: "http://localhost:5173,http://127.0.0.1:5173"
      - key: CSRF_TRUSTED_ORIGINS
        value: "http://localhost:5173,http://127.0.0.1:5173"
      # JWT lifetimes (prod)
      - key: JWT_ACCESS_MINUTES
        value: "30"
      - key: JWT_REFRESH_DAYS
        value: "10"

      # Managed Redis (Render Key Value) — must be under `services`
      - type: keyvalue              # `redis` is a deprecated alias
        name: votingsphere-redis
        plan: free
        ipAllowList: [ ]             # required; empty list = internal-only

databases:
  - name: votingsphere-pg
    plan: free
