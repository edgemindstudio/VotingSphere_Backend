# render.yaml

services:
  - type: web
    name: votingsphere-api
    env: python
    plan: free
    autoDeploy: true

    # Install deps + collect static
    buildCommand: |
      pip install -r requirements.txt
      python manage.py collectstatic --noinput

    # Free plan has no preDeployCommand; run migrations at start
    startCommand: |
      python manage.py migrate --noinput && \
      daphne -b 0.0.0.0 -p $PORT VotingSphere.asgi:application

    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: VotingSphere.settings.prod
      - key: SECRET_KEY
        generateValue: true

      # Postgres from managed DB below
      - key: DATABASE_URL
        fromDatabase:
          name: votingsphere-pg
          property: connectionString

      # Redis URL from managed Redis service below
      - key: REDIS_URL
        fromService:
          type: redis
          name: votingsphere-redis
          property: connectionString

      # You can tighten these after first deploy
      - key: ALLOWED_HOSTS
        value: "*"
      - key: CORS_ALLOWED_ORIGINS
        value: "http://localhost:5173,http://127.0.0.1:5173"
      - key: CSRF_TRUSTED_ORIGINS
        value: "http://localhost:5173,http://127.0.0.1:5173"

      # JWT lifetimes
      - key: JWT_ACCESS_MINUTES
        value: "30"
      - key: JWT_REFRESH_DAYS
        value: "10"

  # Managed Redis (free)
  - type: redis
    name: votingsphere-redis
    plan: free
    ipAllowList: []   # internal only

databases:
  - name: votingsphere-pg
    plan: free
